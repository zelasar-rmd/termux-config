# ~/.tmux.conf — reading comfort for live TUIs in Termux
#
# Why: Termux has no scroll-lock and does not implement DECSET 2026
# (synchronized output), so a live TUI that repaints every frame (Command
# Code, Claude Code, Antigravity, ...) both flickers and drags the viewport
# back to the bottom while you scroll up. tmux copy-mode holds the view:
# output keeps collecting in history, but it cannot pull you down and the
# region you are reading stops repainting.
#
# Enter copy-mode: Ctrl-b [   (or just scroll — see `mouse on` below)
# Leave copy-mode: q

set -g mouse on             # wheel / touch scroll enters copy-mode and holds
set -g history-limit 50000  # long transcript to read back through
set -g mode-keys vi
