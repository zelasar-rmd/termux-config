### Fix: live TUIs (Claude Code, Antigravity, Command Code, etc.) keep
### yanking the view back to the bottom while you scroll up to read.
### Makes each swipe travel further and grows the scrollback, so the
### refresh can't drag you down as easily. See docs/scroll-jump-fix.md.
touch-scroll-multiplier = 4
terminal-transcript-rows = 50000

extra-keys = [ \
  ['DRAWER', {macro: "exit\n", display: "KILL"}, {macro: "CTRL u", display: "CLR"}, 'CTRL', 'ALT', 'TAB', 'KEYBOARD', 'LEFT', 'DOWN', 'UP', 'RIGHT'], \
  [{macro: "sys-clean\n", display: "FREE"}, 'ESC', 'HOME', 'END', 'PGUP', 'PGDN', '/', '-', '_', '='], \
  ['F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'F8', 'F9', 'F10', 'F11', 'F12'] \
]
